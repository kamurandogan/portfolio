<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Projects Showcase - KD Portfolio</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-primary": "#ffffff",
                        "error": "#ba1a1a",
                        "surface-container-low": "#fff2e1",
                        "on-background": "#221a0d",
                        "surface-bright": "#fff8f3",
                        "on-surface-variant": "#58413f",
                        "inverse-primary": "#ffb3ad",
                        "surface-variant": "#f0e0ca",
                        "on-tertiary-fixed": "#330e22",
                        "on-primary-container": "#fffbff",
                        "surface-container-high": "#f6e6d0",
                        "secondary": "#586400",
                        "on-secondary": "#ffffff",
                        "on-error-container": "#93000a",
                        "surface-container": "#fcecd5",
                        "inverse-surface": "#382f20",
                        "primary-fixed-dim": "#ffb3ad",
                        "secondary-container": "#d9ed62",
                        "primary": "#a92f2e",
                        "tertiary-container": "#98667c",
                        "on-tertiary": "#ffffff",
                        "on-secondary-fixed-variant": "#424b00",
                        "tertiary-fixed": "#ffd8e7",
                        "on-primary-fixed-variant": "#8b181b",
                        "error-container": "#ffdad6",
                        "primary-fixed": "#ffdad7",
                        "primary-container": "#ca4743",
                        "outline-variant": "#e0bfbc",
                        "background": "#fff8f3",
                        "surface-tint": "#ac3230",
                        "on-tertiary-fixed-variant": "#65394e",
                        "on-primary-fixed": "#410004",
                        "secondary-fixed-dim": "#bed049",
                        "on-surface": "#221a0d",
                        "surface": "#fff8f3",
                        "outline": "#8c716e",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-highest": "#f0e0ca",
                        "secondary-fixed": "#d9ed62",
                        "on-secondary-fixed": "#191e00",
                        "on-error": "#ffffff",
                        "on-secondary-container": "#5e6b00",
                        "tertiary": "#7d4e63",
                        "surface-dim": "#e7d8c2",
                        "inverse-on-surface": "#ffeed8",
                        "tertiary-fixed-dim": "#f2b6cf",
                        "on-tertiary-container": "#fffbff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "section-gap": "128px",
                        "gutter": "24px",
                        "block-padding": "32px",
                        "base": "8px",
                        "container-max": "1440px",
                        "section-gap-mobile": "64px"
                    },
                    "fontFamily": {
                        "label-mono": ["JetBrains Mono"],
                        "body-md": ["Hanken Grotesk"],
                        "display-lg-mobile": ["Bricolage Grotesque"],
                        "body-lg": ["Hanken Grotesk"],
                        "nav-link": ["Hanken Grotesk"],
                        "headline-xl": ["Bricolage Grotesque"],
                        "headline-lg": ["Bricolage Grotesque"],
                        "display-lg": ["Bricolage Grotesque"]
                    },
                    "fontSize": {
                        "label-mono": ["14px", { "lineHeight": "20px", "fontWeight": "500" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "display-lg-mobile": ["64px", { "lineHeight": "60px", "letterSpacing": "-0.02em", "fontWeight": "800" }],

                        "nav-link": ["18px", { "lineHeight": "24px", "fontWeight": "700" }],
                        "headline-xl": ["72px", { "lineHeight": "80px", "letterSpacing": "-0.02em", "fontWeight": "800" }],
                        "headline-lg": ["48px", { "lineHeight": "56px", "fontWeight": "700" }],
                        "display-lg": ["120px", { "lineHeight": "110px", "letterSpacing": "-0.04em", "fontWeight": "800" }]

                }
            }
        }
    </script>
<style>
        /* Custom Taupe Background as requested */
        .bg-taupe { background-color: #D4C5B0; }
        
        /* Custom project card colors */
        .bg-broccolai { background-color: #1A2E1A; }
        .bg-wedlist { background-color: #2E1A1F; }
        
        /* Slider mechanics */
        .slider-container {
            scroll-snap-type: x mandatory;
            scrollbar-width: none; /* Firefox */
        }
        .slider-container::-webkit-scrollbar {
            display: none; /* Chrome/Safari */
        }
        .snap-center { scroll-snap-align: center; }
        
        /* Specific Material Icons setup */
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-taupe text-on-surface overflow-hidden min-h-screen flex flex-col font-body-md">
<!-- TopAppBar -->
<header class="docked full-width top-0 fixed flex justify-between items-center w-full px-gutter py-block-padding z-50 bg-transparent no-border flat no shadows text-secondary-fixed font-headline-lg text-headline-lg font-extrabold transition-colors">
<div class="hover:text-primary transition-colors cursor-pointer text-[#E9FD70]">KD</div>
<div class="flex gap-4 items-center">
<button class="font-label-mono text-label-mono bg-transparent text-[#E9FD70] border-none px-4 py-2 hover:opacity-80 transition-opacity flex items-center gap-1 font-bold text-lg">
                Menu +
</button>
</div>
</header>
<!-- Main Content Canvas - Horizontal Slider -->
<main class="flex-grow flex flex-col justify-center items-center relative w-full pt-[120px] pb-gutter h-screen">
<!-- Slider Track -->
<div class="slider-container flex w-full overflow-x-auto gap-12 px-[22.5vw] snap-x snap-mandatory items-center pb-12" id="project-slider">
<div class="snap-center shrink-0 w-[55vw] h-[614px] md:h-[716px] flex flex-col justify-between border-2 border-black bg-wedlist relative opacity-50 scale-90 transition-transform duration-500 ease-in-out cursor-pointer hover:opacity-100 group">
<div class="flex-grow flex items-center justify-center p-8 z-10 overflow-hidden">
<h2 class="font-display-lg-mobile md:font-display-lg text-display-lg-mobile md:text-display-lg text-white text-center font-extrabold">WEDLIST</h2>
</div>
<div class="h-16 border-t-2 border-black flex justify-between items-center px-6 bg-surface text-on-surface z-10">
<p class="font-label-mono text-label-mono uppercase">WEDDING LIST MANAGER</p>
<div class="flex gap-2 text-on-surface">
<span class="material-symbols-outlined text-[24px]">favorite</span>
<span class="material-symbols-outlined text-[24px]">laptop_mac</span>
</div>
</div>
</div>
<div class="snap-center shrink-0 w-[55vw] h-[614px] md:h-[716px] flex flex-col justify-between border-2 border-black bg-broccolai relative shadow-[8px_8px_0px_0px_rgba(0,0,0,1)] scale-100 transition-transform duration-500 ease-in-out cursor-pointer z-20 group">
<div class="flex-grow flex items-center justify-center p-8 z-10 overflow-hidden">
<h2 class="font-display-lg-mobile md:font-display-lg text-display-lg-mobile md:text-display-lg text-white text-center font-extrabold group-hover:scale-105 transition-transform duration-300">BROCCOLAI</h2>
</div>
<div class="h-16 border-t-2 border-black flex justify-between items-center px-6 bg-surface text-on-surface z-10">
<p class="font-label-mono text-label-mono uppercase">AI FOOTBALL PREDICTIONS</p>
<div class="flex gap-2 text-on-surface">
<span class="material-symbols-outlined text-[24px]">sports_soccer</span>
<span class="material-symbols-outlined text-[24px]">phone_iphone</span>
</div>
</div>
</div>
<div class="snap-center shrink-0 w-[55vw] h-[614px] md:h-[716px] flex flex-col justify-between border-2 border-black bg-surface relative opacity-50 scale-90 transition-transform duration-500 ease-in-out cursor-pointer hover:opacity-100 group">
<div class="flex-grow flex items-center justify-center p-8 z-10 overflow-hidden">
<h2 class="font-display-lg-mobile md:font-display-lg text-display-lg-mobile md:text-display-lg text-black text-center font-extrabold">NEXT<br/>PROJ</h2>
</div>
</div></div>
<!-- Navigation Pills -->
<div class="absolute bottom-8 left-1/2 -translate-x-1/2 flex gap-4 z-30">
<button aria-label="Previous Project" class="w-16 h-12 rounded-full border-2 border-black bg-secondary-fixed text-black flex items-center justify-center shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] hover:bg-white active:translate-x-[4px] active:translate-y-[4px] active:shadow-none transition-all" onclick="document.getElementById('project-slider').scrollBy({left: -window.innerWidth * 0.6, behavior: 'smooth'})">
<span class="material-symbols-outlined text-black font-bold" data-icon="arrow_back" data-weight="fill">arrow_back</span>
</button>
<button aria-label="Next Project" class="w-16 h-12 rounded-full border-2 border-black bg-secondary-fixed text-black flex items-center justify-center shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] hover:bg-white active:translate-x-[4px] active:translate-y-[4px] active:shadow-none transition-all" onclick="document.getElementById('project-slider').scrollBy({left: window.innerWidth * 0.6, behavior: 'smooth'})">
<span class="material-symbols-outlined text-black font-bold" data-icon="arrow_forward" data-weight="fill">arrow_forward</span>
</button>
</div>
</main>
<script>
        // Simple JS to handle centering the initial card (Broccolai) on load
        document.addEventListener('DOMContentLoaded', () => {
            const slider = document.getElementById('project-slider');
            // Scroll to the second item (index 1) to start on Broccolai
            if(slider && slider.children.length > 1) {
                const centerTarget = slider.children[1];
                // slight timeout to allow layout to settle
                setTimeout(() => {
                    centerTarget.scrollIntoView({ behavior: 'auto', block: 'nearest', inline: 'center' });
                }, 100);
            }
        });
    </script>
</body></html>
